[project]
name = "dfs-dork-optimizer"
version = "0.1.0"
description = "Backend API for optimizing Yahoo NBA daily fantasy lineups"
authors = [{ name = "Marco Di Spirito", email = "marco.n.dispirito@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pydfs-lineup-optimizer>=3.6.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optimizer"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
